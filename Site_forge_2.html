<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge — Website Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & TOKENS
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c;
  --surface:#101013;
  --surface-2:#161619;
  --surface-3:#1d1d21;
  --surface-4:#252528;
  --border:rgba(255,255,255,.07);
  --border-hover:rgba(255,255,255,.14);
  --border-focus:rgba(255,255,255,.2);
  --text:#ededef;
  --text-muted:#9b9ba3;
  --text-faint:#5e5e68;
  --accent:#7c5cff;
  --accent-hover:#8e72ff;
  --accent-ring:rgba(124,92,255,.25);
  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,.12);
  --danger-border:rgba(239,68,68,.35);
  --r-sm:5px;
  --r:7px;
  --r-lg:10px;
  --ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
#app{display:flex;flex-direction:column;height:100%}

/* ============================================================
   BUTTONS & CONTROLS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:30px;padding:0 11px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:12.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;user-select:none;transition:all 120ms var(--ease);
}
.btn svg{width:14px;height:14px;flex-shrink:0;stroke-width:2}
.btn:hover{background:var(--surface-3);border-color:var(--border-hover)}
.btn:active{transform:translateY(.5px) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn:focus-visible{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(255,255,255,.05)}

.btn-primary{background:#ededef;border-color:#ededef;color:#0a0a0c;font-weight:550}
.btn-primary:hover{background:#fff;border-color:#fff;color:#0a0a0c}
.btn-primary:active{background:#d8d8da;border-color:#d8d8da}

.btn-icon{width:30px;padding:0}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger-border);color:#f87171}
.btn-block{display:flex;width:100%;height:32px}

.segmented{display:inline-flex;align-items:center;gap:1px;padding:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;height:30px}
.segmented button{
  height:24px;padding:0 10px;border:0;border-radius:5px;background:transparent;
  color:var(--text-muted);font-family:inherit;font-size:12px;font-weight:500;
  cursor:pointer;transition:all 120ms var(--ease);white-space:nowrap;
}
.segmented button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.03)}
.segmented button.on{background:var(--surface-4);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04)}

.toggle{position:relative;width:36px;height:20px;border-radius:10px;background:var(--surface-3);border:1px solid var(--border);cursor:pointer;transition:all 150ms var(--ease);flex-shrink:0;padding:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#ededef;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:all 150ms var(--ease)}
.toggle:hover{border-color:var(--border-hover)}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{transform:translateX(16px);background:#fff}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.toggle-row-label{font-size:12.5px;font-weight:500;color:var(--text)}

/* ============================================================
   TOPBAR
   ============================================================ */
#topbar{height:52px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 0 2px;margin-right:6px}
.logo-mark{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#7c5cff,#5b3fd1);box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 1px 2px rgba(0,0,0,.4);flex-shrink:0}
.logo-mark svg{width:13px;height:13px;color:#fff;stroke-width:2.5}
.brand-name{font-size:13.5px;font-weight:600;color:var(--text)}
.divider-v{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0}
.spacer{flex:1}

/* ============================================================
   LAYOUT
   ============================================================ */
#main{flex:1;display:flex;min-height:0}
aside{background:var(--surface);overflow-y:auto;padding:14px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:#26262a transparent}
aside::-webkit-scrollbar{width:10px}
aside::-webkit-scrollbar-thumb{background:#26262a;border-radius:5px;border:2px solid var(--surface)}
aside::-webkit-scrollbar-thumb:hover{background:#3a3a40}
#left{width:250px;border-right:1px solid var(--border)}
#right{width:276px;border-left:1px solid var(--border)}

.panel-title{font-size:11px;font-weight:550;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}
.panel-title:first-child{margin-top:0}

/* SEARCH & TABS */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-faint);pointer-events:none;stroke-width:2.2}
#palSearch{width:100%;height:32px;padding:0 10px 0 31px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--r);font-family:inherit;font-size:12.5px;outline:none;transition:all 120ms}
#palSearch::placeholder{color:var(--text-faint)}
#palSearch:focus{border-color:var(--accent);background:var(--surface-3);box-shadow:0 0 0 3px var(--accent-ring)}

.pal-tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.pal-tabs::-webkit-scrollbar{display:none}
.pal-tabs button{flex:1 0 30%;min-width:0;height:24px;padding:0 8px;background:transparent;border:0;color:var(--text-muted);border-radius:5px;font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all 120ms}
.pal-tabs button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.03)}
.pal-tabs button.on{background:var(--surface-4);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04)}

/* PALETTE */
#palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 6px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;text-align:center;transition:all 120ms}
.pal-btn:hover{background:var(--surface-3);border-color:var(--border-hover);color:var(--text)}
.pal-btn:active{transform:scale(.98)}
.pal-ic{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;background:var(--surface-4);color:var(--text-muted);font-family:ui-monospace,monospace;font-size:11px;font-weight:600;transition:all 120ms}
.pal-btn:hover .pal-ic{background:rgba(124,92,255,.18);color:var(--accent)}
.pal-empty{grid-column:1/-1;padding:28px 12px;text-align:center;color:var(--text-faint);font-size:12px}

/* TEMPLATES */
.tpl-btn{display:block;width:100%;padding:10px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);margin-bottom:6px;font-family:inherit;font-size:12.5px;font-weight:500;text-align:left;cursor:pointer;transition:all 120ms}
.tpl-btn:hover{background:var(--surface-3);border-color:var(--border-hover)}
.tpl-btn small{display:block;color:var(--text-muted);font-size:11.5px;font-weight:450;margin-top:2px}

/* CANVAS */
#canvasWrap{flex:1;overflow:auto;padding:32px;display:flex;justify-content:center;align-items:flex-start;background:var(--bg);background-image:radial-gradient(circle, rgba(255,255,255,.035) 1px, transparent 1px);background-size:20px 20px}
#canvasWrap::-webkit-scrollbar{width:10px;height:10px}
#canvasWrap::-webkit-scrollbar-thumb{background:#26262a;border-radius:5px;border:2px solid var(--bg)}
#canvas{width:100%;max-width:1080px;background:#fff;color:#0f172a;min-height:100%;border-radius:8px;overflow:hidden;transition:max-width 200ms;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.4),0 20px 60px rgba(0,0,0,.5);container-type:inline-size}
#canvas iframe{pointer-events:none}
@container (max-width:640px){.rg{grid-template-columns:1fr!important}}
.nl:hover{color:var(--h)!important}

/* BLOCKS */
.blk{position:relative;display:flow-root}
#canvas > .blk.root:not(.blk-section){max-width:1000px;margin:0 auto;padding:0 24px}
.blk:hover{outline:1.5px dashed rgba(124,92,255,.45);outline-offset:-1.5px}
.blk.selected{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.blk > .toolbar{position:absolute;top:6px;right:6px;display:inline-flex;align-items:center;gap:1px;padding:3px;background:rgba(15,15,18,.96);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity 120ms;z-index:60}
.blk:hover > .toolbar, .blk.selected > .toolbar{opacity:1;pointer-events:auto}
.toolbar button{width:24px;height:24px;padding:0;background:transparent;border:0;border-radius:4px;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 100ms}
.toolbar button svg{width:13px;height:13px;stroke-width:2.2}
.toolbar button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.toolbar button[data-act="del"]:hover{background:var(--danger-bg);color:#f87171}

.sec-empty{padding:24px;border:1.5px dashed #cbd5e1;border-radius:8px;text-align:center;color:#94a3b8;font-size:12.5px}
.empty-canvas{padding:96px 32px;text-align:center;color:#94a3b8;font-size:13px;line-height:1.8}
[contenteditable]:focus{outline:none}

/* RIGHT PANEL */
.sel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.sel-name{font-weight:600;font-size:13px;color:var(--text)}
.sel-btns{display:flex;gap:2px}
.sel-btns .btn{width:26px;height:26px;padding:0}
.sel-btns .btn svg{width:13px;height:13px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:500;color:var(--text-muted);margin-bottom:6px}
.field input[type="text"],.field input[type="url"],.field input[type="number"],.field textarea,.field select{width:100%;height:32px;padding:0 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:12.5px;outline:none;transition:all 120ms}
.field input:hover:not(:focus),.field textarea:hover:not(:focus),.field select:hover:not(:focus){border-color:var(--border-hover)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:var(--surface-3);box-shadow:0 0 0 3px var(--accent-ring)}
.field textarea{height:auto;padding:8px 10px;min-height:70px;line-height:1.55;resize:vertical}
.field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%239b9ba3' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;cursor:pointer}
.field select option{background:var(--surface-2);color:var(--text)}
.field .row{display:flex;gap:8px;align-items:center}

.field input[type="color"]{width:32px;height:32px;padding:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;flex-shrink:0}
.field input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.field input[type="color"]::-webkit-color-swatch{border:0;border-radius:4px}

.field input[type="range"]{-webkit-appearance:none;width:100%;height:4px;background:var(--surface-3);border-radius:2px;outline:none;cursor:pointer;margin:10px 0 8px}
.field input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ededef;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.field .val{min-width:40px;text-align:right;font-size:11.5px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:2px;gap:1px}
.seg button{flex:1;height:24px;background:transparent;border:0;color:var(--text-muted);border-radius:4px;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:500;transition:all 120ms}
.seg button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.03)}
.seg button.on{background:var(--surface-4);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.divider-line{height:1px;background:var(--border);margin:16px 0}

.toolbar button[data-act="drag"]{cursor:grab}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:998;padding:24px}
.modal{background:var(--surface-2);border:1px solid var(--border-hover);border-radius:12px;padding:20px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{font-size:14px;font-weight:600;margin-bottom:8px}
.modal p{color:var(--text-muted);font-size:12.5px;line-height:1.6;margin-bottom:14px}
.modal textarea{width:100%;height:240px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--r);padding:10px;font:12px ui-monospace,Menlo,monospace;resize:vertical;margin-bottom:14px;outline:none}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal.wide{max-width:none;height:100%;display:flex;flex-direction:column;padding:12px}
.modal.wide iframe{flex:1;border:0;background:#fff;border-radius:8px;width:100%;margin:0 auto}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%, 12px);display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface-3);border:1px solid var(--border-hover);border-radius:8px;color:var(--text);font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:all 180ms;z-index:999;box-shadow:0 12px 32px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%, 0)}
#toast svg{width:14px;height:14px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="5" width="14" height="3" rx="1" fill="currentColor" stroke="none"/>
          <rect x="5" y="10" width="14" height="3" rx="1" fill="currentColor" stroke="none"/>
          <rect x="5" y="15" width="8" height="3" rx="1" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <span class="brand-name">Forge</span>
    </div>
    <div class="divider-v"></div>
    <button class="btn btn-icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="btn btn-icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <div class="divider-v"></div>
    <div class="segmented" id="devices" role="tablist">
      <button data-w="1080" class="on" role="tab">Desktop</button>
      <button data-w="768" role="tab">Tablet</button>
      <button data-w="390" role="tab">Phone</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="previewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
      Preview
    </button>
    <button class="btn" id="copyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      Copy
    </button>
    <button class="btn btn-primary" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      Export
    </button>
  </header>
  <div id="main">
    <aside id="left">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="palSearch" placeholder="Search blocks…">
      </div>
      <div class="pal-tabs" id="palTabs" role="tablist">
        <button data-cat="all" class="on" role="tab">All</button>
        <button data-cat="basic" role="tab">Basic</button>
        <button data-cat="layout" role="tab">Layout</button>
        <button data-cat="content" role="tab">Content</button>
        <button data-cat="social" role="tab">Social</button>
        <button data-cat="advanced" role="tab">More</button>
      </div>
      <div id="palette"></div>
      <div class="panel-title">Templates</div>
      <div id="templates"></div>
    </aside>
    <main id="canvasWrap"><div id="canvas"></div></main>
    <aside id="right"></aside>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   ICONS & HELPERS
   ============================================================ */
const ICONS = {
  grip: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  dup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
};

const $ = (s,r=document) => r.querySelector(s);
const uid = () => 'b'+Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clone = o => JSON.parse(JSON.stringify(o));
function mkEl(tag, className, html) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (html != null) e.innerHTML = html;
  return e;
}

/* Static-form handler used by exported forms */
const FORM_JS = "event.preventDefault();alert('Thanks! This is a static form - connect a backend to receive submissions.')";

/* Live countdown (also inlined into exported pages that use it) */
function countdownTick(){
  document.querySelectorAll('[data-countdown]').forEach(function(w){
    var t = (w.getAttribute('data-countdown') || '').trim();
    var d = new Date(t.length <= 10 ? t + 'T00:00:00' : t);
    var s = isNaN(d) ? 0 : Math.max(0, Math.floor((d - Date.now()) / 1000));
    var v = {d:Math.floor(s/86400), h:Math.floor(s%86400/3600), m:Math.floor(s%3600/60), s:s%60};
    Object.keys(v).forEach(function(k){
      var e = w.querySelector('[data-cd="'+k+'"]');
      if(e) e.textContent = String(v[k]).padStart(2,'0');
    });
  });
}

/* In-app modal (works where alert/confirm/popups are blocked) */
function openModal(cls, build, onClose){
  const bg = mkEl('div','modal-bg');
  const m = mkEl('div','modal ' + (cls||''));
  const onKey = e=>{ if(e.key === 'Escape'){ e.stopPropagation(); close(); } };
  function close(){
    if(!bg.parentNode) return;
    bg.remove();
    document.removeEventListener('keydown', onKey, true);
    if(onClose) onClose();
  }
  document.addEventListener('keydown', onKey, true);
  bg.addEventListener('mousedown', e=>{ if(e.target === bg) close(); });
  bg.appendChild(m);
  document.body.appendChild(bg);
  build(m, close);
  return close;
}
function askConfirm(msg, okLabel){
  return new Promise(res=>{
    let ok = false;
    openModal('', (m, close)=>{
      m.innerHTML = '<h3>Please confirm</h3><p>' + esc(msg) + '</p>';
      const row = mkEl('div','modal-actions');
      const no = mkEl('button','btn','Cancel');
      const yes = mkEl('button','btn btn-primary', esc(okLabel||'Confirm'));
      no.onclick = close;
      yes.onclick = ()=>{ ok = true; close(); };
      row.append(no, yes); m.appendChild(row);
      yes.focus();
    }, ()=> res(ok));
  });
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
function downloadFile(name, text){
  try{
    const url = URL.createObjectURL(new Blob([text], { type:'text/html;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1500);
    toast('Download started');
  }catch(e){ toast('Download blocked — use Copy code'); }
}

/* Built-in placeholder images ("ph:W,H,Label,hex") work offline and in sandboxes */
function imgSrc(u){
  u = String(u == null ? '' : u).trim();
  if(u.slice(0,3) !== 'ph:') return u;
  const [w,h,label,hex] = u.slice(3).split(',');
  const W = +w || 600, H = +h || 400;
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='"+W+"' height='"+H+"' viewBox='0 0 "+W+" "+H+"'><rect width='100%' height='100%' fill='#"+(/^[0-9a-f]{3,6}$/i.test(hex||'')?hex:'e0e7ff')+"'/><text x='50%' y='50%' fill='#475569' font-family='sans-serif' font-size='"+Math.round(Math.min(W,H)/9)+"' text-anchor='middle' dominant-baseline='middle'>"+esc(label||'Image')+"</text></svg>";
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
/* Accept normal YouTube / Vimeo links and convert them to embed URLs */
function embedUrl(u){
  u = String(u || '').trim();
  let m = u.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  if(m) return 'https://www.youtube.com/embed/' + m[1];
  m = u.match(/^https?:\/\/(?:www\.)?vimeo\.com\/(\d+)/);
  if(m) return 'https://player.vimeo.com/video/' + m[1];
  return u;
}

function bindEdits(root, b){
  root.querySelectorAll('[data-edit]').forEach(el=>{
    const key = el.dataset.edit;
    const isHTML = el.dataset.html === '1';
    el.contentEditable = 'true';
    el.spellcheck = false;
    let dirty = false;
    el.addEventListener('input', ()=>{
      b.props[key] = isHTML ? el.innerHTML : el.textContent;
      if(state.sel === b.id){
        const f = $('#right [data-k="'+key+'"]');
        if(f) f.value = b.props[key];
      }
      dirty = true; save();
    });
    el.addEventListener('blur', ()=>{ if(dirty){ dirty = false; commit(); } });
    el.addEventListener('paste', e=>{
      e.preventDefault();
      const txt = (e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, txt);
    });
  });
}

/* ============================================================
   HISTORY & STORAGE
   ============================================================ */
let histStack = [], hIndex = -1;
function commit(){
  histStack = histStack.slice(0, hIndex + 1);
  histStack.push(JSON.stringify(state.page));
  if(histStack.length > 80) histStack.shift();
  hIndex = histStack.length - 1;
  updateHistoryButtons();
  save();
}
function undo(){
  if(hIndex <= 0) return;
  hIndex--;
  state.page = JSON.parse(histStack[hIndex]);
  state.sel = null;
  renderAll(); save(); updateHistoryButtons();
}
function redo(){
  if(hIndex >= histStack.length - 1) return;
  hIndex++;
  state.page = JSON.parse(histStack[hIndex]);
  state.sel = null;
  renderAll(); save(); updateHistoryButtons();
}
function updateHistoryButtons(){
  $('#undoBtn').disabled = hIndex <= 0;
  $('#redoBtn').disabled = hIndex >= histStack.length - 1;
}

const KEY = 'forge.site.v9';
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(state.page)); }
    catch(e){ if(!save.warned){ save.warned = true; toast('Auto-save unavailable here'); } }
  }, 300);
}

/* ============================================================
   TREE HELPERS
   ============================================================ */
function findBlock(id, list){
  list = list || state.page.blocks;
  for(const b of list){
    if(b.id === id) return b;
    if(b.props && b.props.children){
      const f = findBlock(id, b.props.children);
      if(f) return f;
    }
  }
  return null;
}
function findParentBlock(id, list, parent){
  list = list || state.page.blocks;
  parent = parent || null;
  for(const b of list){
    if(b.id === id) return parent;
    if(b.props && b.props.children){
      const r = findParentBlock(id, b.props.children, b);
      if(r) return r;
    }
  }
  return null;
}
function findParentList(id, list){
  list = list || state.page.blocks;
  for(let i=0;i<list.length;i++){
    if(list[i].id === id) return { list, index:i };
    if(list[i].props && list[i].props.children){
      const r = findParentList(id, list[i].props.children);
      if(r) return r;
    }
  }
  return null;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderCanvas(){
  const c = $('#canvas');
  c.style.background = state.page.bg;
  c.style.fontFamily = FONTS[state.page.font] || FONTS.system;
  c.innerHTML = '';
  if(!state.page.blocks || !state.page.blocks.length){
    c.innerHTML = '<div class="empty-canvas">Your page is empty.<br>Pick a template or add a block →</div>';
    return;
  }
  state.page.blocks.forEach(b => c.appendChild(renderBlock(b, true)));
  applySelection();
  countdownTick();
}

function renderBlock(b, isRoot){
  const def = BLOCK_DEFS[b.type];
  if(!def) return mkEl('div', '', 'Unknown block');
  const blockEl = document.createElement('div');
  blockEl.className = 'blk' + (isRoot ? ' root' : '') + (FULL_BLEED.includes(b.type) ? ' blk-section' : '');
  blockEl.dataset.id = b.id;
  blockEl.dataset.type = b.type;
  blockEl.appendChild(makeToolbar(b));
  const content = def.render(b);
  blockEl.appendChild(content);
  return blockEl;
}

function makeToolbar(b){
  const tb = mkEl('div', 'toolbar');
  const grip = document.createElement('button');
  grip.type = 'button'; grip.draggable = true; grip.dataset.act = 'drag';
  grip.title = 'Drag to move'; grip.setAttribute('aria-label', 'Drag to move');
  grip.innerHTML = ICONS.grip;
  grip.addEventListener('click', e=> e.stopPropagation());
  grip.addEventListener('dragstart', e=>{
    e.stopPropagation();
    dragInfo = { kind:'move', id:b.id, type:b.type };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'forge');
    if(tb.parentNode && e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(tb.parentNode, 16, 16);
  });
  tb.appendChild(grip);
  const cfg = { up:ICONS.up, down:ICONS.down, dup:ICONS.dup, del:ICONS.del };
  const titles = { up:'Move up', down:'Move down', dup:'Duplicate', del:'Delete' };
  ['up','down','dup','del'].forEach(act=>{
    const btn = document.createElement('button');
    btn.innerHTML = cfg[act];
    btn.dataset.act = act;
    btn.title = titles[act];
    btn.setAttribute('aria-label', titles[act]);
    btn.addEventListener('click', e=>{ e.stopPropagation(); handleAction(act, b.id); });
    tb.appendChild(btn);
  });
  return tb;
}

function applySelection(){
  document.querySelectorAll('#canvas .blk.selected').forEach(e => e.classList.remove('selected'));
  if(!state.sel) return;
  const el = document.querySelector(`#canvas .blk[data-id="${state.sel}"]`);
  if(el) el.classList.add('selected');
}

function select(id){
  state.sel = id;
  applySelection();
  renderPanel();
}

function renderAll(){
  renderCanvas();
  renderPanel();
}

function renderPanel(){
  const panel = $('#right');
  panel.innerHTML = '';
  const b = state.sel ? findBlock(state.sel) : null;
  if(!b){ renderPageSettings(panel); return; }

  const def = BLOCK_DEFS[b.type];
  const head = mkEl('div', 'sel-head');
  head.innerHTML = `<span class="sel-name">${def.label}</span><span class="sel-btns">
    <button class="btn btn-icon" data-a="dup" title="Duplicate" aria-label="Duplicate">${ICONS.dup}</button>
    <button class="btn btn-icon btn-danger" data-a="del" title="Delete" aria-label="Delete">${ICONS.del}</button>
  </span>`;
  head.querySelector('.sel-btns').addEventListener('click', e=>{
    const btn = e.target.closest('[data-a]');
    if(!btn) return;
    handleAction(btn.dataset.a, b.id);
  });
  panel.appendChild(head);

  const onChange = ()=>{ renderCanvas(); applySelection(); save(); };
  const onCommit = ()=>{ commit(); };

  def.fields.forEach(f => panel.appendChild(buildField(f, b.props, onChange, onCommit)));

  if(b.type === 'section' || b.type === 'columns'){
    const note = mkEl('div');
    note.style.cssText = 'font-size:11.5px;line-height:1.5;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin-top:8px;letter-spacing:-.005em';
    note.textContent = 'Blocks added while this ' + (b.type==='section'?'section':'column') + ' is selected go inside it.';
    panel.appendChild(note);
  }
}

function renderPageSettings(panel){
  panel.appendChild(mkEl('div', 'panel-title', 'Page Settings'));
  const onChange = ()=>{ renderCanvas(); save(); };
  const onCommit = ()=>{ commit(); };

  const titleWrap = mkEl('div', 'field');
  titleWrap.innerHTML = '<label>Page title</label>';
  const titleInp = document.createElement('input');
  titleInp.type = 'text';
  titleInp.value = state.page.title || 'My Website';
  titleInp.addEventListener('input', ()=>{ state.page.title = titleInp.value; save(); });
  titleInp.addEventListener('change', ()=> commit());
  titleWrap.appendChild(titleInp);
  panel.appendChild(titleWrap);

  panel.appendChild(buildField({k:'bg',t:'color',label:'Page background'}, state.page, onChange, onCommit));

  const fontWrap = mkEl('div', 'field');
  fontWrap.innerHTML = '<label>Font family</label>';
  const sel = document.createElement('select');
  Object.entries({ system:'System Sans', serif:'Serif', mono:'Monospace', rounded:'Rounded', elegant:'Elegant Serif' })
    .forEach(([k,v])=>{
      const o = document.createElement('option');
      o.value = k; o.textContent = v;
      if(state.page.font === k) o.selected = true;
      sel.appendChild(o);
    });
  sel.addEventListener('change', ()=>{ state.page.font = sel.value; onChange(); commit(); });
  fontWrap.appendChild(sel);
  panel.appendChild(fontWrap);

  panel.appendChild(mkEl('div', 'divider-line'));

  const clear = mkEl('button', 'btn btn-danger btn-block');
  clear.innerHTML = `${ICONS.del}Clear page`;
  clear.onclick = async ()=>{
    if(!(await askConfirm('Delete everything on this page?', 'Delete'))) return;
    state.page.blocks = [];
    state.sel = null;
    commit(); renderAll();
  };
  panel.appendChild(clear);

  const tip = mkEl('div');
  tip.style.cssText = 'font-size:11.5px;color:var(--text-muted);line-height:1.7;margin-top:16px;letter-spacing:-.005em';
  tip.innerHTML = '<span style="color:var(--text);font-weight:500">Shortcuts</span><br>Ctrl+Z undo · Ctrl+Shift+Z / Ctrl+Y redo<br>Del delete · Esc deselect';
  panel.appendChild(tip);
}

function buildField(f, obj, onChange, onCommit){
  const wrap = mkEl('div', 'field');
  const numeric = typeof obj[f.k] === 'number';

  if(f.t === 'toggle'){
    const row = mkEl('div', 'toggle-row');
    const lab = mkEl('span', 'toggle-row-label', f.label);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toggle' + (obj[f.k] ? ' on' : '');
    btn.setAttribute('role', 'switch');
    btn.onclick = ()=>{
      obj[f.k] = !obj[f.k];
      btn.classList.toggle('on', !!obj[f.k]);
      onChange(); onCommit && onCommit();
    };
    row.appendChild(lab); row.appendChild(btn);
    wrap.appendChild(row);
    return wrap;
  }

  const lab = mkEl('label', '', f.label);
  wrap.appendChild(lab);

  if(f.t === 'color'){
    const row = mkEl('div', 'row');
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = obj[f.k] || '#ffffff';
    const hex = document.createElement('input');
    hex.type = 'text';
    hex.value = obj[f.k] || '#ffffff';
    inp.addEventListener('input', ()=>{ obj[f.k] = inp.value; hex.value = inp.value; onChange(); });
    inp.addEventListener('change', ()=> onCommit && onCommit());
    hex.addEventListener('input', ()=>{
      if(/^#[0-9a-f]{6}$/i.test(hex.value)){ obj[f.k] = hex.value; inp.value = hex.value; onChange(); }
    });
    hex.addEventListener('change', ()=> onCommit && onCommit());
    row.appendChild(inp); row.appendChild(hex);
    wrap.appendChild(row);
  } else if(f.t === 'range'){
    const row = mkEl('div', 'row');
    const inp = document.createElement('input');
    inp.type = 'range';
    inp.min = f.min; inp.max = f.max; inp.step = f.step || 1;
    inp.value = obj[f.k];
    const val = mkEl('span', 'val', obj[f.k] + (f.unit||''));
    inp.addEventListener('input', ()=>{
      obj[f.k] = Number(inp.value);
      val.textContent = inp.value + (f.unit||'');
      onChange();
    });
    inp.addEventListener('change', ()=> onCommit && onCommit());
    row.appendChild(inp); row.appendChild(val);
    wrap.appendChild(row);
  } else if(f.t === 'align'){
    const seg = mkEl('div', 'seg');
    [['left','Left'],['center','Center'],['right','Right']].forEach(([v,l])=>{
      const b = document.createElement('button');
      b.textContent = l;
      b.type = 'button';
      if(obj[f.k] === v) b.classList.add('on');
      b.onclick = ()=>{
        obj[f.k] = v;
        [...seg.children].forEach(c => c.classList.remove('on'));
        b.classList.add('on');
        onChange(); onCommit && onCommit();
      };
      seg.appendChild(b);
    });
    wrap.appendChild(seg);
  } else if(f.t === 'select'){
    const sel = document.createElement('select');
    f.opts.forEach(([v,l])=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = l;
      if(String(obj[f.k]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', ()=>{
      const raw = sel.value;
      if(numeric) obj[f.k] = Number(raw);
      else if(raw === 'true') obj[f.k] = true;
      else if(raw === 'false') obj[f.k] = false;
      else obj[f.k] = raw;
      onChange(); onCommit && onCommit();
    });
    wrap.appendChild(sel);
  } else if(f.t === 'area'){
    const ta = document.createElement('textarea');
    ta.value = obj[f.k];
    ta.dataset.k = f.k;
    ta.rows = 4;
    ta.addEventListener('input', ()=>{ obj[f.k] = ta.value; onChange(); });
    ta.addEventListener('change', ()=> onCommit && onCommit());
    wrap.appendChild(ta);
  } else if(f.t === 'image'){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'https://…';
    inp.value = /^data:/.test(obj[f.k]) ? '(uploaded image)' : obj[f.k];
    inp.addEventListener('input', ()=>{ obj[f.k] = inp.value; onChange(); });
    inp.addEventListener('change', ()=> onCommit && onCommit());
    wrap.appendChild(inp);

    const fileWrap = mkEl('div');
    fileWrap.style.cssText = 'margin-top:6px';
    const file = document.createElement('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.style.cssText = 'font-size:11px;color:var(--text-muted);font-family:inherit';
    file.addEventListener('change', ()=>{
      const fl = file.files[0];
      if(!fl) return;
      if(fl.size > 400000){ toast('Image too large (max 400 KB)'); return; }
      const r = new FileReader();
      r.onload = ()=>{ obj[f.k] = r.result; inp.value = '(uploaded image)'; onChange(); onCommit && onCommit(); };
      r.readAsDataURL(fl);
    });
    fileWrap.appendChild(file);
    wrap.appendChild(fileWrap);
  } else {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = obj[f.k];
    inp.dataset.k = f.k;
    inp.addEventListener('input', ()=>{
      obj[f.k] = numeric ? Number(inp.value) : inp.value;
      onChange();
    });
    inp.addEventListener('change', ()=> onCommit && onCommit());
    wrap.appendChild(inp);
  }

  return wrap;
}

function canNestIn(parentType, childType){
  if(parentType === 'section') return childType !== 'section';
  if(parentType === 'columns') return childType !== 'section' && childType !== 'columns';
  return false;
}

function addBlock(type){
  const nb = mk(type);
  const sel = state.sel ? findBlock(state.sel) : null;

  if(sel && (sel.type === 'section' || sel.type === 'columns') && canNestIn(sel.type, type)){
    sel.props.children.push(nb);
  } else if(sel){
    /* climb out of containers that can't hold this block type (e.g. a section inside columns) */
    let target = sel, par;
    while((par = findParentBlock(target.id)) && !canNestIn(par.type, type)) target = par;
    const found = findParentList(target.id);
    if(found){ found.list.splice(found.index + 1, 0, nb); }
    else { state.page.blocks.push(nb); }
  } else {
    state.page.blocks.push(nb);
  }

  state.sel = nb.id;
  commit(); renderAll(); scrollToBlock(nb.id);
}

function handleAction(act, id){
  const found = findParentList(id);
  if(!found) return;
  const { list, index } = found;

  if(act === 'del'){
    list.splice(index, 1);
    if(state.sel && !findBlock(state.sel)) state.sel = null;
  } else if(act === 'dup'){
    const copy = clone(list[index]);
    reId(copy);
    list.splice(index + 1, 0, copy);
    state.sel = copy.id;
  } else if(act === 'up' && index > 0){
    [list[index-1], list[index]] = [list[index], list[index-1]];
  } else if(act === 'down' && index < list.length - 1){
    [list[index+1], list[index]] = [list[index], list[index+1]];
  }
  commit(); renderAll();
}

function scrollToBlock(id){
  setTimeout(()=>{
    const el = document.querySelector(`#canvas .blk[data-id="${id}"]`);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 60);
}

/* ============================================================
   EXPORT
   ============================================================ */
/* ============================================================
   DRAG & DROP  (palette -> canvas, and reorder with the toolbar grip)
   ============================================================ */
let dragInfo = null;
const dropInd = mkEl('div');
dropInd.style.cssText = 'position:fixed;pointer-events:none;z-index:90;display:none;border-radius:3px';
document.body.appendChild(dropInd);

function placeBlock(nb, targetId, pos){
  let target = targetId ? findBlock(targetId) : null;
  if(!target){ state.page.blocks.push(nb); return; }
  if(pos === 'inside' && canNestIn(target.type, nb.type)){ target.props.children.push(nb); return; }
  let par;
  while((par = findParentBlock(target.id)) && !canNestIn(par.type, nb.type)) target = par;
  const f = findParentList(target.id);
  f.list.splice(f.index + (pos === 'before' ? 0 : 1), 0, nb);
}
function isSelfOrChild(dragId, targetId){
  const mv = findBlock(dragId);
  return !mv || targetId === dragId || !!(targetId && findBlock(targetId, mv.props.children || []));
}
function getDrop(e){
  const el = e.target.closest ? e.target.closest('#canvas .blk') : null;
  if(!el) return { id:null, pos:'after', rect:null };
  const b = findBlock(el.dataset.id);
  const r = el.getBoundingClientRect();
  let pos = e.clientY < r.top + r.height/2 ? 'before' : 'after';
  if(b && dragInfo && canNestIn(b.type, dragInfo.type)) pos = 'inside';
  return { id: b ? b.id : null, pos, rect:r };
}
function endDrag(){ dragInfo = null; dropInd.style.display = 'none'; }

(function(){
  const wrap = $('#canvasWrap');
  wrap.addEventListener('dragover', e=>{
    if(!dragInfo) return;
    const d = getDrop(e);
    if(dragInfo.kind === 'move' && isSelfOrChild(dragInfo.id, d.id)){ dropInd.style.display = 'none'; return; }
    e.preventDefault();
    e.dataTransfer.dropEffect = dragInfo.kind === 'move' ? 'move' : 'copy';
    const r = d.rect || $('#canvas').getBoundingClientRect();
    const st = dropInd.style;
    st.display = 'block'; st.left = r.left + 'px'; st.width = r.width + 'px';
    if(d.pos === 'inside'){
      st.top = r.top + 'px'; st.height = r.height + 'px';
      st.background = 'rgba(124,92,255,.12)'; st.outline = '2px dashed #7c5cff';
    } else {
      st.height = '3px'; st.outline = 'none'; st.background = '#7c5cff';
      st.top = (d.rect && d.pos === 'before' ? r.top - 1 : Math.min(r.bottom, window.innerHeight) - 2) + 'px';
    }
  });
  wrap.addEventListener('dragleave', e=>{ if(!wrap.contains(e.relatedTarget)) dropInd.style.display = 'none'; });
  wrap.addEventListener('drop', e=>{
    if(!dragInfo) return;
    e.preventDefault();
    const info = dragInfo, d = getDrop(e);
    endDrag();
    if(info.kind === 'new'){
      const nb = mk(info.type);
      placeBlock(nb, d.id, d.pos);
      state.sel = nb.id;
    } else {
      if(isSelfOrChild(info.id, d.id)) return;
      const mv = findBlock(info.id), f = findParentList(info.id);
      f.list.splice(f.index, 1);
      placeBlock(mv, d.id, d.pos);
      state.sel = mv.id;
    }
    commit(); renderAll(); scrollToBlock(state.sel);
  });
  document.addEventListener('dragend', endDrag);
})();

function blockHTML(b, isRoot){
  const def = BLOCK_DEFS[b.type];
  if(!def || typeof def.export !== 'function') return '';
  try {
    const html = def.export(b);
    if(!isRoot) return html;
    if(FULL_BLEED.includes(b.type)) return html;
    return `<div style="max-width:1000px;margin:0 auto;padding:0 24px">${html}</div>`;
  } catch(e) {
    console.error("Error exporting block:", b.type, e);
    return '';
  }
}

function exportHTML(){
  EXPORTING = true;
  let body;
  try{ body = (state.page.blocks || []).map(b => blockHTML(b, true)).join('\n'); } finally { EXPORTING = false; }
  body = body
    .replace(/ data-edit="[^"]*"/g,'').replace(/ data-html="1"/g,'');
  const cdScript = body.includes('data-countdown=')
    ? `<script>${countdownTick.toString()};countdownTick();setInterval(countdownTick,1000)<\/script>\n`
    : '';
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(state.page.title || 'My Website')}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:${state.page.bg};font-family:${FONTS[state.page.font] || FONTS.system};-webkit-font-smoothing:antialiased;color:#0f172a}
  img{max-width:100%;height:auto}
  a{transition:opacity .2s}
  a:hover{opacity:.88}
  summary::-webkit-details-marker{display:none}
  summary{list-style:none}
  .nl:hover{color:var(--h)!important}
  @media(max-width:640px){.rg{grid-template-columns:1fr!important}}
</style>
</head>
<body>
${body}
${cdScript}</body>
</html>`;
}

let toastT;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = `${ICONS.check}<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=> t.classList.remove('show'), 2500);
}

   ============================================================ */
function buildPalette(){
  const pal = $('#palette');
  const q = $('#palSearch').value.toLowerCase().trim();
  const activeCat = $('#palTabs .on').dataset.cat;
  pal.innerHTML = '';
  let count = 0;
  Object.entries(BLOCK_DEFS).forEach(([type, def])=>{
    if(activeCat !== 'all' && def.category !== activeCat) return;
    if(q && !def.label.toLowerCase().includes(q) && !type.toLowerCase().includes(q)) return;
    const btn = mkEl('button', 'pal-btn');
    btn.type = 'button';
    btn.innerHTML = `<span class="pal-ic">${esc(def.icon)}</span><span>${def.label}</span>`;
    btn.title = 'Add ' + def.label;
    btn.addEventListener('click', ()=> addBlock(type));
    btn.draggable = true;
    btn.addEventListener('dragstart', e=>{
      dragInfo = { kind:'new', type };
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', 'forge');
    });
    pal.appendChild(btn);
    count++;
  });
  if(!count){ pal.innerHTML = '<div class="pal-empty">No blocks match</div>'; }
}

function buildTemplates(){
  const box = $('#templates');
  box.innerHTML = '';
  Object.entries(TEMPLATES).forEach(([key, t])=>{
    const b = mkEl('button', 'tpl-btn');
    b.type = 'button';
    b.innerHTML = `${t.name}<small>${t.desc}</small>`;
    b.onclick = async ()=>{
      if(!(await askConfirm(`Replace the current page with "${t.name}"?`, 'Replace'))) return;
      state.page.blocks = t.make();
      state.sel = null;
      commit(); renderAll(); toast('Template loaded');
    };
    box.appendChild(b);
  });
}

/* Export: download, or copy the code if downloads are blocked */
function showExport(){
  const html = exportHTML();
  const name = (state.page.title || 'my-website').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.html';
  openModal('', (m, close)=>{
    m.innerHTML = '<h3>Export site</h3><p>Download the finished page, or copy the code. If downloads are blocked in this environment, paste it into a file named <b>' + esc(name) + '</b>.</p>';
    const ta = document.createElement('textarea');
    ta.readOnly = true; ta.value = html;
    ta.addEventListener('focus', ()=> ta.select());
    const row = mkEl('div', 'modal-actions');
    const cl = mkEl('button', 'btn', 'Close');
    const cp = mkEl('button', 'btn', 'Copy code');
    const dl = mkEl('button', 'btn btn-primary', 'Download .html');
    cl.onclick = close;
    cp.onclick = async ()=>{
      if(await copyText(html)) toast('HTML copied to clipboard');
      else { ta.focus(); ta.select(); toast('Press Ctrl+C to copy'); }
    };
    dl.onclick = ()=> downloadFile(name, html);
    row.append(cl, cp, dl);
    m.append(ta, row);
  });
}
$('#exportBtn').onclick = showExport;

document.addEventListener('keydown', e=>{
  const ae = document.activeElement;
  const editing = ae && (ae.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName));
  if(editing) return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'y')){
    e.preventDefault();
    (k === 'y' || e.shiftKey) ? redo() : undo();
    return;
  }
  if((e.key === 'Delete' || e.key === 'Backspace') && state.sel){
    e.preventDefault();
    handleAction('del', state.sel);
  }
  if(e.key === 'Escape') select(null);
});

(function init(){
  buildPalette();
  buildTemplates();

  let loaded = null;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) loaded = JSON.parse(raw);
  }catch(e){ loaded = null; }

  if(loaded && loaded.blocks){
    state.page = loaded;
    if(!state.page.font) state.page.font = 'system';
    if(!state.page.title) state.page.title = 'My Website';
    if(!state.page.bg) state.page.bg = '#ffffff';
  } else {
    state.page = { title:'My Website', bg:'#ffffff', font:'system', blocks: TEMPLATES.landing.make() };
  }

  histStack = [JSON.stringify(state.page)];
  hIndex = 0;
  updateHistoryButtons();
  renderAll();
  setInterval(countdownTick, 1000);
})();
</script>
